<section class="data-packages">
  <div class="packages-container">
    <div class="section-header">
      <h2 class="section-title">Chọn Gói Data Phù Hợp</h2>
      <p class="section-subtitle">Nhiều lựa chọn với giá cả hợp lý, đáp ứng mọi nhu cầu sử dụng</p>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
      <!-- Package Type Navigation -->
      <div class="package-type-nav-wrapper">
        <div class="package-type-nav">
          <button 
            *ngFor="let type of packageTypes" 
            class="nav-item"
            [class.active]="selectedPackageType === type.id"
            (click)="selectPackageType(type.id)">
            {{ type.label }}
          </button>
        </div>
      </div>

      <!-- Quick Filters -->
      <div class="quick-filters">
        <button 
          class="filter-btn"
          [class.active]="selectedPriceSort !== null"
          (click)="togglePriceSort()">
          <span>Giá</span>
          <span class="sort-icon" *ngIf="selectedPriceSort === 'asc'">▲</span>
          <span class="sort-icon" *ngIf="selectedPriceSort === 'desc'">▼</span>
        </button>
        <button 
          class="filter-btn"
          [class.active]="selectedDuration === 'all'"
          (click)="selectDuration('all')">
          Tất cả
        </button>
        <button 
          class="filter-btn"
          [class.active]="selectedDuration === '1'"
          (click)="selectDuration('1')">
          1 ngày
        </button>
        <button 
          class="filter-btn"
          [class.active]="selectedDuration === '5'"
          (click)="selectDuration('5')">
          5 ngày
        </button>
        <button 
          class="filter-btn"
          [class.active]="selectedDuration === '7'"
          (click)="selectDuration('7')">
          7 ngày
        </button>
        <button 
          class="filter-btn"
          [class.active]="selectedDuration === '30'"
          (click)="selectDuration('30')">
          30 ngày
        </button>
        <button 
          class="filter-btn"
          [class.active]="selectedDuration === 'long'"
          (click)="selectDuration('long')">
          Dài ngày
        </button>
      </div>
    </div>

    <div class="packages-grid" 
         [class.has-1-item]="packageCount === 1"
         [class.has-2-items]="packageCount === 2">
      <div 
        *ngFor="let pkg of filteredPackages" 
        class="package-card"
        [class.popular]="pkg.popular">
        
        <!-- Phần đầu: Tên gói cước - Thời hạn -->
        <div class="package-header-section">
          <div class="package-header-content">
            <span class="package-name-duration">{{ pkg.name }} - {{ pkg.duration }}</span>
          </div>
        </div>

        <!-- Phần giữa: Thông tin và tiện ích (có scroll) -->
        <div class="package-content-section">
          <div class="package-info-list">
            <!-- Data -->
            <div class="info-item" *ngIf="pkg.dailyData">
              <span class="info-icon wifi-icon">📶</span>
              <span class="info-label">Data:</span>
              <span class="info-value">{{ pkg.dailyData }}</span>
            </div>
            
            <!-- Ưu đãi -->
            <div class="info-item" *ngIf="pkg.promotion">
              <span class="info-icon gift-icon">🎁</span>
              <span class="info-label">Ưu đãi:</span>
              <span class="info-value">{{ pkg.promotion }}</span>
            </div>
            
            <!-- Tiện ích -->
            <div class="info-item" *ngIf="pkg.utility">
              <span class="info-icon play-icon">▶</span>
              <span class="info-label">Tiện ích:</span>
              <span class="info-value">{{ pkg.utility }}</span>
            </div>

            <!-- Features -->
            <div class="info-item" *ngFor="let feature of pkg.features">
              <span class="info-icon check-icon">✓</span>
              <span class="info-value">{{ feature }}</span>
            </div>
          </div>
        </div>

        <!-- Phần cuối: Giá, nút Đăng ký và Xem chi tiết -->
        <div class="package-footer-section">
          <div class="package-price">
            <span class="price-amount">{{ formatPrice(pkg.price) }}</span>
            <span class="price-unit">₫</span>
          </div>
          
          <div class="package-actions">
            <button 
              class="btn-register"
              (click)="selectPackage(pkg)">
              Đăng ký
            </button>
            <a 
              class="btn-details"
              (click)="viewDetails(pkg)">
              Xem chi tiết >
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
