<section class="data-packages">
  <div class="packages-container">
    <div class="section-header">
      <h2 class="section-title">Chọn Gói Data Phù Hợp</h2>
      <p class="section-subtitle">Nhiều lựa chọn với giá cả hợp lý, đáp ứng mọi nhu cầu sử dụng</p>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
      <!-- Package Type Navigation -->
      <div class="package-type-nav-wrapper">
        <div class="package-type-nav">
          <button 
            *ngFor="let type of packageTypes" 
            class="nav-item"
            [class.active]="selectedPackageType === type.id"
            (click)="selectPackageType(type.id)">
            {{ type.label }}
          </button>
        </div>
      </div>

      <!-- Quick Filters -->
      <div class="quick-filters">
        <button 
          class="filter-btn"
          [class.active]="selectedPriceSort !== null"
          (click)="togglePriceSort()">
          <span>Giá</span>
          <span class="sort-icon" *ngIf="selectedPriceSort === 'asc'">▲</span>
          <span class="sort-icon" *ngIf="selectedPriceSort === 'desc'">▼</span>
        </button>
        <button 
          class="filter-btn"
          [class.active]="selectedDuration === 'all'"
          (click)="selectDuration('all')">
          Tất cả
        </button>
        <button 
          class="filter-btn"
          [class.active]="selectedDuration === '30'"
          (click)="selectDuration('30')">
          30 ngày
        </button>
        <button 
          class="filter-btn"
          [class.active]="selectedDuration === 'long'"
          (click)="selectDuration('long')">
          Dài ngày
        </button>
      </div>
    </div>

    <div class="packages-grid">
      <div 
        *ngFor="let pkg of filteredPackages" 
        class="package-card"
        [class.popular]="pkg.popular"
        [style.border-top-color]="pkg.color">
        
        <div *ngIf="pkg.popular" class="popular-badge">
          <span>Phổ biến</span>
        </div>

        <div class="package-header">
          <h3 class="package-name">{{ pkg.name }}</h3>
          <div class="package-data" [style.color]="pkg.color">
            <span class="data-amount">{{ pkg.data }}</span>
            <span class="data-label">Data</span>
          </div>
        </div>

        <div class="package-price">
          <span class="price-amount">{{ formatPrice(pkg.price) }}</span>
          <span class="price-unit">đ</span>
          <span class="price-duration">/ {{ pkg.duration }}</span>
        </div>

        <div class="package-features">
          <ul class="features-list">
            <li *ngFor="let feature of pkg.features" class="feature-item">
              <span class="check-icon">✓</span>
              <span>{{ feature }}</span>
            </li>
          </ul>
        </div>

        <button 
          class="btn-select"
          [style.background]="pkg.color"
          (click)="selectPackage(pkg)">
          Đăng ký ngay
        </button>
      </div>
    </div>
  </div>
</section>
