<header class="header">
  <div class="header-container">
    <div class="logo-section">
      <a href="/" class="logo">
        <span class="logo-text">ULTRATEL</span>
      </a>
    </div>

    <nav id="main-nav" class="nav-menu" [class.menu-open]="isMenuOpen" [attr.aria-hidden]="!isMenuOpen">
      <ul class="nav-list">
        <li><a href="#" class="nav-link active">Di động</a></li>
        <li><a href="#" class="nav-link">Internet<span class="coming-soon-badge">Soon</span></a></li>
        <li><a href="#" class="nav-link">Truyền hình<span class="coming-soon-badge">Soon</span></a></li>
        <li><a href="#" class="nav-link">Dịch vụ<span class="coming-soon-badge">Soon</span></a></li>
        <li><a href="#" class="nav-link" (click)="scrollToFooter(); $event.preventDefault()">Hỗ trợ</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <!-- Trước khi tra cứu: nút Tra cứu (scroll xuống form) -->
      <ng-container *ngIf="(lookupStatus$ | async) !== 'success'">
        <button type="button" class="btn-login" (click)="scrollToLookup()">Tra cứu</button>
      </ng-container>
      <!-- Sau khi tra cứu thành công: chỉ hiện số điện thoại -->
      <div *ngIf="(lookupStatus$ | async) === 'success'" class="header-subscriber-phone-only">
        {{ lookedUpPhoneDisplay$ | async }}
      </div>
      <button
        type="button"
        class="btn-menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="main-nav"
        aria-label="Mở menu điều hướng">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
