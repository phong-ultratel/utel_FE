<!-- Modal Overlay -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header">
      <h2 class="modal-title">Điều khoản & Chính sách</h2>
      <button class="modal-close-btn" (click)="closeModal()" aria-label="Đóng">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Navigation Tabs -->
    <div class="modal-tabs">
      <button
        *ngFor="let section of policySections"
        class="tab-button"
        [class.active]="selectedSection === section.id"
        (click)="selectSection(section.id)">
        {{ section.title }}
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <div class="policy-content" [innerHTML]="getCurrentSection()?.content"></div>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button class="modal-close-button" (click)="closeModal()">Đóng</button>
    </div>
  </div>
</div>
